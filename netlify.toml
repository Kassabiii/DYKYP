# Netlify builds the app from this folder and serves the static output.
# Set VITE_SPOTIFY_CLIENT_ID (and optionally VITE_SPOTIFY_REDIRECT_URI) in
# Site configuration → Environment variables before the first deploy.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Single-page app: send unknown paths (including the Spotify ?code= callback) to index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
